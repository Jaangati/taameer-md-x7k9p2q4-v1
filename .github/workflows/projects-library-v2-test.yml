name: Projects Library v2 validation
on:
  push:
    branches: [projects-library-v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check js/projects.js
      - name: Projects Library assertions
        run: |
          grep -q "Projects Library" js/projects.js
          grep -q "COUNTRY_FLAGS" js/projects.js
          grep -q "exportProjectPDF" js/projects.js
          grep -q "exportAllPDF" js/projects.js
          grep -q "usageTypes" js/projects.js
          grep -q "customFields" js/projects.js
          grep -q "customFacts" js/projects.js
          grep -q "pl-input.filled" js/projects.js
          ! grep -q "Profile Health" js/projects.js
          ! grep -q "Reference data imported" js/projects.js
