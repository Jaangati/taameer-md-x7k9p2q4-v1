name: Enable User Management v2
on:
  push:
    paths:
      - '.github/workflows/enable-user-management-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add secure user management script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="js/admin.js"></script>\n<script src="js/app.js"></script>'
          new='<script src="js/admin.js"></script>\n<script src="js/admin-users-v2.js"></script>\n<script src="js/app.js"></script>'
          if 'js/admin-users-v2.js' not in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: node --check js/admin-users-v2.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable secure User Management v2" || exit 0
          git push origin main
