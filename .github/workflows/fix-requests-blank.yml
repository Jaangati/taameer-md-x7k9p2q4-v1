name: Fix Requests blank page

on:
  push:
    paths:
      - '.github/workflows/fix-requests-blank.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire Requests directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Requests was being dynamically injected from app.js. On GitHub Pages that can leave
          # the generated module view empty if the runtime binding is not available when clicked.
          # Load it exactly like the other feature modules instead.
          if 'src="js/requests.js' not in s:
              marker='<script src="js/app.js?v=20260907-final"></script>'
              if marker not in s:
                  marker='<script src="js/app.js"></script>'
              if marker not in s:
                  raise SystemExit('app.js script marker not found')
              s=s.replace(marker, '<script src="js/requests.js?v=20260912-v2"></script>\n'+marker, 1)
          else:
              import re
              s=re.sub(r'<script src="js/requests\.js(?:\?[^\"]*)?"></script>', '<script src="js/requests.js?v=20260912-v2"></script>', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Make Requests navigation self-healing: if a stale browser somehow misses the direct
          # script, load it and open the module instead of showing an empty page.
          p=Path('js/ui.js')
          s=p.read_text(encoding='utf-8')
          old="  if (viewName === 'requests' && typeof RequestsApp !== 'undefined' && RequestsApp?.open) RequestsApp.open();"
          new="""  if (viewName === 'requests') {
    if (typeof RequestsApp !== 'undefined' && RequestsApp?.open) {
      RequestsApp.open().catch(err => console.error('Requests open failed', err));
    } else if (typeof loadRequestsModuleScript === 'function') {
      loadRequestsModuleScript().then(() => RequestsApp.open()).catch(err => {
        console.error('Requests module failed to load', err);
        const el=document.getElementById('view-requests');
        if(el) el.innerHTML='<div class=\"h-full flex items-center justify-center text-sm text-red-500\">Requests failed to load. Please refresh the page.</div>';
      });
    }
  }"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate hotfix
        run: |
          node --check js/requests.js
          node --check js/ui.js
          node --check js/app.js
          grep -q 'js/requests.js?v=20260912-v2' index.html
          grep -q "viewName === 'requests'" js/ui.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/ui.js
          git diff --cached --quiet || git commit -m 'Fix Requests module blank page'
          git push
