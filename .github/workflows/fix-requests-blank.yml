name: Fix Requests blank page

on:
  push:
    paths:
      - '.github/workflows/fix-requests-blank.yml'
      - '.github/scripts/fix_requests_blank.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Requests hotfix
        run: python .github/scripts/fix_requests_blank.py
      - name: Validate hotfix
        run: |
          node --check js/requests.js
          node --check js/ui.js
          node --check js/app.js
          grep -q 'js/requests.js?v=20260912-v2' index.html
          grep -q "viewName === 'requests'" js/ui.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/ui.js
          git diff --cached --quiet || git commit -m 'Fix Requests module blank page'
          git push
