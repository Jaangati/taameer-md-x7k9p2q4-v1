name: Calendar v1 integration

on:
  push:
    paths:
      - '.github/workflows/calendar-v1.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # index.html: load calendar runtime before app
          p=Path('index.html'); s=p.read_text()
          if 'js/calendar.js' not in s:
              needle='<script src="js/app.js?v=20260907-final"></script>'
              if needle in s:
                  s=s.replace(needle,'<script src="js/calendar.js?v=20260907-v1"></script>\n'+needle,1)
              else:
                  needle='<script src="js/app.js"></script>'
                  s=s.replace(needle,'<script src="js/calendar.js?v=20260907-v1"></script>\n'+needle,1)
          p.write_text(s)

          # ui.js: activate Calendar app and labels
          p=Path('js/ui.js'); s=p.read_text()
          s=s.replace("calendar: ['Calendar','Coming soon']", "calendar: ['Calendar','My schedule & department activity']")
          old="if (viewName === 'home') renderHomeModules(); if (viewName === 'users') loadUsers(); if (viewName === 'modules-admin') renderAdminModules(); if (viewName === 'permissions') renderPermissions();"
          new="if (viewName === 'calendar' && window.CalendarApp) CalendarApp.open(); if (viewName === 'home') renderHomeModules(); if (viewName === 'users') loadUsers(); if (viewName === 'modules-admin') renderAdminModules(); if (viewName === 'permissions') renderPermissions();"
          if old in s: s=s.replace(old,new,1)
          s=s.replace("const soon=m.status==='soon';", "const soon=false;")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check js/calendar.js
          node --check js/core.js
          node --check js/ui.js
          grep -q 'js/calendar.js' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/ui.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate TAAMEER team calendar v1"
            git push
          fi
