name: Load authoritative v4 fixes
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Load authoritative module and request fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="js/requests-fixes-v5.js?v=20260913-v1"></script>','<script src="js/requests-fixes-v5.js?v=20260913-v1"></script>\n<script src="js/requests-fixes-v6.js?v=20260913-v2"></script>',1)
          s=s.replace('<script src="js/control-center-v3.js?v=20260913-v1"></script>','<script src="js/control-center-v3.js?v=20260913-v1"></script>\n<script src="js/control-center-v4.js?v=20260913-v2"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check js/requests-fixes-v6.js
          node --check js/control-center-v4.js
          grep -q 'requests-fixes-v6.js' index.html
          grep -q 'control-center-v4.js' index.html
          git config user.name 'TAAMEER Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Activate authoritative module and request fixes'
          git push
