name: Requests v4 labels

on:
  push:
    paths:
      - '.github/workflows/requests-v4-labels.yml'
      - '.github/scripts/requests_v4_labels.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/requests_v4_labels.py
      - name: Validate
        run: |
          node --check js/requests.js
          grep -q 'Completed</div>' js/requests.js
          grep -q 'New Request' js/requests.js
          ! grep -Eqi '\bTasks?\b' js/requests.js
          grep -q 'js/requests.js?v=20260912-v13' index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/requests.js index.html
          git commit -m 'Refine Requests wording and add completed count'
          git push origin main
