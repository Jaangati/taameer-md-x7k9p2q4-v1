name: Calendar v2 cache refresh
on:
  push:
    paths:
      - '.github/workflows/calendar-v2-cache.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Calendar asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('js/calendar.js?v=20260907-v1','js/calendar.js?v=20260907-v2')
          p.write_text(s)
          PY
          node --check js/calendar.js
          grep -q 'js/calendar.js?v=20260907-v2' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load Calendar v2"
          git push