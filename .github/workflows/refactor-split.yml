name: Split dashboard files

on:
  push:
    branches: [refactor-v2]
    paths:
      - '.github/workflows/refactor-split.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-v2

      - name: Split inline CSS and app JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # CSS
          m = re.search(r'<style>\s*(.*?)\s*</style>', text, flags=re.S)
          if not m:
              raise SystemExit('Inline style block not found')
          css = m.group(1).strip() + '\n'
          Path('css').mkdir(exist_ok=True)
          Path('css/styles.css').write_text(css, encoding='utf-8')
          text = text[:m.start()] + '<link rel="stylesheet" href="css/styles.css">' + text[m.end():]

          # Main application JS only; keep Tailwind config inline.
          scripts = list(re.finditer(r'<script>(.*?)</script>', text, flags=re.S))
          app = None
          for s in scripts:
              body = s.group(1)
              if "'use strict'" in body and 'const CONFIG = Object.freeze' in body:
                  app = s
                  break
          if not app:
              raise SystemExit('Main application script not found')

          js = app.group(1).strip() + '\n'
          Path('js').mkdir(exist_ok=True)
          Path('js/app.js').write_text(js, encoding='utf-8')
          text = text[:app.start()] + '<script src="js/app.js"></script>' + text[app.end():]

          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/styles.css js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Refactor: split CSS and application JS"
          git push origin refactor-v2
