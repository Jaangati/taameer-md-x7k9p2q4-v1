name: Activity usage v2
on:
  push:
    paths:
      - '.github/scripts/activity_usage_patch.py'
      - '.github/workflows/activity-usage-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/activity_usage_patch.py
      - name: Validate
        run: |
          node --check js/ui.js
          node --check js/activity-log.js
          grep -q "requests: 4" js/ui.js
          grep -q "Activity & Usage Center" js/activity-log.js
          grep -q "activity-log.js?v=20260912-v2" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js index.html
          git diff --cached --quiet || git commit -m "Reorder modules and deploy activity usage center"
          git push
