name: Vault v5 editor and system dark polish
on:
  push:
    paths:
      - '.github/workflows/vault-v5-editor-system-dark.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Vault editor and dark system color
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css=Path('css/styles.css')
          s=css.read_text()
          s=s.replace(':root { --accent: #757575; --accent-soft: rgba(117,117,117,0.12); --accent-hover: rgba(117,117,117,0.22); }', ':root { --accent: #757575; --accent-soft: rgba(117,117,117,0.12); --accent-hover: rgba(117,117,117,0.22); --system-dark: #030712; --system-dark-2: #111827; }')
          css.write_text(s)

          p=Path('js/vault.js')
          s=p.read_text()

          s=s.replace(".vault-askbox{position:relative;border-radius:24px;padding:18px;background:linear-gradient(135deg,#111827 0%,#1f2937 48%,var(--accent) 150%);color:#fff;box-shadow:0 16px 34px rgba(15,23,42,.16);overflow:hidden;z-index:3}", ".vault-askbox{position:relative;border-radius:24px;padding:18px;background:linear-gradient(90deg,var(--system-dark) 0%,var(--system-dark-2) 58%,var(--accent) 145%);color:#fff;box-shadow:0 16px 34px rgba(3,7,18,.18);overflow:hidden;z-index:3}")

          old_css=""".vault-compose{width:min(650px,94vw);background:#f7f8fa;border-radius:25px;box-shadow:0 34px 110px rgba(0,0,0,.24);overflow:hidden}.vault-compose-top{padding:16px 18px;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;display:flex;justify-content:space-between;align-items:center}.vault-compose-body{padding:16px}.vault-compose-title{width:100%;border:0;background:transparent;font-size:22px;font-weight:850;outline:0;color:#171b22;padding:2px 0 9px}.vault-compose textarea{width:100%;min-height:145px;border:1px solid #e3e6eb;background:#fff;border-radius:15px;padding:13px;outline:0;resize:vertical;font-size:12px;line-height:1.65}.vault-compose-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.vault-compose select,.vault-compose input.meta{height:40px;border-radius:11px;border:1px solid #e1e4e9;background:#fff;padding:0 11px;font-size:11px;outline:0}.vault-color-row{display:flex;align-items:center;gap:7px;margin-top:11px}.vault-color-row button{width:30px;height:30px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.vault-color-row button.active{border-color:#111827}.vault-smart-tags{margin-top:10px;padding:10px 11px;border-radius:13px;background:#fff;border:1px solid #e5e7eb}.vault-smart-tags .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.vault-smart-tags .chips span{font-size:9px;padding:4px 6px;border-radius:7px;background:#eef1f5;color:#5f6876}.vault-compose-foot{padding:12px 16px;border-top:1px solid #e4e7eb;display:flex;justify-content:space-between;gap:10px;background:#fff}.vault-compose-foot button{height:38px;padding:0 13px;border-radius:10px;border:1px solid #e0e4e8;background:#fff;font-size:11px;font-weight:800}.vault-compose-foot button.save{background:#111827;color:#fff;border-color:#111827}"""
          new_css=""".vault-compose{width:min(1180px,96vw);max-height:88vh;background:#f7f8fa;border-radius:26px;box-shadow:0 36px 120px rgba(3,7,18,.28);overflow:hidden;display:flex;flex-direction:column}.vault-compose-top{padding:17px 20px;background:linear-gradient(90deg,var(--system-dark) 0%,var(--system-dark-2) 70%,var(--accent) 155%);color:#fff;display:flex;justify-content:space-between;align-items:center;flex:none}.vault-compose-body{padding:0;display:grid;grid-template-columns:310px minmax(0,1fr);min-height:0;overflow:auto}.vault-compose-settings{padding:18px;background:#f1f3f6;border-right:1px solid #e2e6ec;display:flex;flex-direction:column;gap:14px}.vault-compose-main{padding:22px;background:#fff;display:flex;flex-direction:column;min-width:0}.vault-field-label{font-size:9px;font-weight:850;letter-spacing:.08em;color:#77808f;margin-bottom:6px;text-transform:uppercase}.vault-compose-title{width:100%;border:1px solid #e3e6eb;background:#f9fafb;border-radius:14px;font-size:22px;font-weight:850;outline:0;color:#171b22;padding:13px 14px;margin-bottom:12px}.vault-compose-title:focus,.vault-compose textarea:focus,.vault-compose select:focus,.vault-compose input.meta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}.vault-compose textarea{width:100%;min-height:360px;flex:1;border:1px solid #e3e6eb;background:#f9fafb;border-radius:16px;padding:15px;outline:0;resize:vertical;font-size:13px;line-height:1.7}.vault-compose-row{display:grid;grid-template-columns:1fr;gap:9px;margin-top:0}.vault-compose select,.vault-compose input.meta{width:100%;height:42px;border-radius:11px;border:1px solid #dfe3e9;background:#fff;padding:0 11px;font-size:11px;outline:0}.vault-color-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.vault-color-row button{width:31px;height:31px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}.vault-color-row button.active{border-color:var(--system-dark);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--system-dark)}.vault-smart-tags{padding:11px 12px;border-radius:13px;background:#fff;border:1px solid #dfe3e9}.vault-smart-tags .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.vault-smart-tags .chips span{font-size:9px;padding:4px 6px;border-radius:7px;background:#eef1f5;color:#5f6876}.vault-compose-foot{padding:12px 16px;border-top:1px solid #e4e7eb;display:flex;justify-content:space-between;gap:10px;background:#fff;flex:none}.vault-compose-foot button{height:38px;padding:0 14px;border-radius:10px;border:1px solid #e0e4e8;background:#fff;font-size:11px;font-weight:800}.vault-compose-foot button.save{background:var(--system-dark);color:#fff;border-color:var(--system-dark)}"""
          if old_css not in s:
              raise SystemExit('vault compose CSS target not found')
          s=s.replace(old_css,new_css)

          s=s.replace(".vault-ask-modal{width:min(760px,94vw);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 34px 110px rgba(0,0,0,.24)}.vault-ask-modal-head{padding:20px;background:linear-gradient(135deg,#111827,#312e81);color:white}.vault-ask-modal-input{display:flex;gap:8px;margin-top:12px;background:#fff;border-radius:14px;padding:6px}.vault-ask-modal-input input{flex:1;border:0;outline:0;padding:0 8px;color:#111827;font-size:13px}.vault-ask-modal-input button{height:36px;border:0;border-radius:10px;background:#4f46e5;color:#fff;padding:0 13px;font-size:11px;font-weight:800}.vault-ask-results{padding:16px;max-height:60vh;overflow:auto}.vault-answer-card{padding:14px;border-radius:15px;background:#f5f6f8;margin-bottom:10px}.vault-answer-card b{font-size:12px}.vault-answer-card p{font-size:11px;color:#687180;white-space:pre-wrap;margin-top:5px;line-height:1.55}", ".vault-ask-modal{width:min(820px,94vw);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 36px 120px rgba(3,7,18,.30)}.vault-ask-modal-head{padding:22px;background:linear-gradient(90deg,var(--system-dark) 0%,var(--system-dark-2) 62%,var(--accent) 150%);color:white}.vault-ask-modal-input{display:flex;gap:8px;margin-top:16px;background:#fff;border-radius:15px;padding:6px;box-shadow:0 10px 30px rgba(3,7,18,.16)}.vault-ask-modal-input input{flex:1;border:0;outline:0;padding:0 8px;color:#111827;font-size:13px}.vault-ask-modal-input button{height:38px;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 15px;font-size:11px;font-weight:800}.vault-ask-results{padding:18px;max-height:60vh;overflow:auto;background:#fff}.vault-answer-card{padding:15px;border-radius:16px;background:#f6f7f9;border:1px solid #eceff3;margin-bottom:10px;transition:.16s}.vault-answer-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(3,7,18,.07)}.vault-answer-card b{font-size:12px;color:#111827}.vault-answer-card p{font-size:11px;color:#687180;white-space:pre-wrap;margin-top:5px;line-height:1.55}")

          old_editor=re.compile(r"  function openEditor\(id=null,quick=false\)\{.*?\n  \}\n  async function saveEditor", re.S)
          m=old_editor.search(s)
          if not m:
              raise SystemExit('openEditor target not found')
          new_editor=r'''  function openEditor(id=null,quick=false){
    const x=id?items.find(i=>i.id===id):null,startColor=x?.card_color||'sunrise';
    const d=modal(`<div class="vault-compose"><div class="vault-compose-top"><div><div class="text-[9px] tracking-[.15em] text-white/45 font-bold">${id?'EDIT NOTE':'SAVE TO VAULT'}</div><div class="text-lg font-bold mt-1">${id?'Update this memory':'Save it once. Find it later.'}</div></div><button data-close class="w-9 h-9 rounded-xl hover:bg-white/10"><i class="fas fa-xmark"></i></button></div><div class="vault-compose-body"><aside class="vault-compose-settings"><div><div class="vault-field-label">Note type</div><select id="veType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${x?.item_type===k?'selected':''}>${v[0]}</option>`).join('')}</select></div><div><div class="vault-field-label">Visibility</div><select id="veVisibility"><option value="department" ${x?.visibility!=='private'?'selected':''}>Department</option><option value="private" ${x?.visibility==='private'?'selected':''}>Private</option></select></div><div><div class="vault-field-label">Card color</div><div class="vault-color-row">${Object.entries(COLORS).map(([k,c])=>`<button data-vcolor="${k}" class="${startColor===k?'active':''}" style="background:${c.bg}" title="${c.name}"></button>`).join('')}</div></div><div class="vault-smart-tags"><div class="flex items-center justify-between"><span class="text-[9px] font-bold text-gray-500">SMART TAGS</span><span class="text-[8px] text-gray-400">automatic</span></div><div id="veSuggested" class="chips"></div></div><div><div class="vault-field-label">Extra tags</div><input id="veTags" class="meta" value="${esc((x?.tags||[]).join(', '))}" placeholder="e.g. campaign, supplier"></div><div><div class="vault-field-label">Source link</div><input id="veUrl" class="meta" value="${esc(x?.source_url||'')}" placeholder="Optional URL"></div></aside><main class="vault-compose-main"><div class="vault-field-label">Title</div><input id="veTitle" class="vault-compose-title" value="${esc(x?.title||'')}" placeholder="Give this note a clear title"><div class="vault-field-label">Note content</div><textarea id="veBody" placeholder="Paste a message, dimensions, list, contact, copy, link, reference...">${esc(x?.body||'')}</textarea></main></div><div class="vault-compose-foot"><span class="text-[9px] text-gray-400 flex items-center"><i class="fas fa-wand-magic-sparkles mr-2"></i>Smart tags are added automatically.</span><div class="flex gap-2"><button data-close>Cancel</button><button id="veSave" class="save">Save</button></div></div></div>`);
    let selectedColor=startColor;const title=document.getElementById('veTitle'),body=document.getElementById('veBody'),type=document.getElementById('veType'),suggest=document.getElementById('veSuggested');
    const refreshTags=()=>{const arr=autoTags(title.value,body.value,type.value);suggest.innerHTML=arr.length?arr.map(t=>`<span>#${esc(t)}</span>`).join(''):'<span>Start typing…</span>';suggest.dataset.tags=arr.join(',')};[title,body,type].forEach(el=>el.addEventListener('input',refreshTags));refreshTags();
    d.querySelectorAll('[data-vcolor]').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.vcolor;d.querySelectorAll('[data-vcolor]').forEach(x=>x.classList.toggle('active',x===b))});d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.remove());document.getElementById('veSave').onclick=()=>saveEditor(id,d,selectedColor);setTimeout(()=>document.getElementById(quick?'veBody':'veTitle')?.focus(),40);
  }
  async function saveEditor'''
          s=s[:m.start()]+new_editor+s[m.end():]

          s=s.replace("@media(max-width:760px){.vault-ask-row{flex-wrap:wrap}.vault-ask-copy{min-width:0;width:100%}.vault-ask-input{width:100%}.vault-head{align-items:flex-start}.vault-head-actions{flex-wrap:wrap;justify-content:flex-end}.vault-compose-row{grid-template-columns:1fr}.vault-grid{grid-template-columns:1fr}}", "@media(max-width:900px){.vault-compose{width:min(720px,96vw);max-height:92vh}.vault-compose-body{grid-template-columns:1fr}.vault-compose-settings{border-right:0;border-bottom:1px solid #e2e6ec;display:grid;grid-template-columns:1fr 1fr}.vault-compose-main{padding:18px}.vault-compose textarea{min-height:260px}}@media(max-width:760px){.vault-ask-row{flex-wrap:wrap}.vault-ask-copy{min-width:0;width:100%}.vault-ask-input{width:100%}.vault-head{align-items:flex-start}.vault-head-actions{flex-wrap:wrap;justify-content:flex-end}.vault-compose-settings{grid-template-columns:1fr}.vault-grid{grid-template-columns:1fr}}")

          p.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          h=re.sub(r'js/vault\.js\?v=[^\"\']+', 'js/vault.js?v=20260908-v5', h)
          idx.write_text(h)
          PY
          node --check js/vault.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/vault.js css/styles.css index.html
          git diff --cached --quiet || git commit -m 'Redesign Vault editor and unify system dark color'
          git push
