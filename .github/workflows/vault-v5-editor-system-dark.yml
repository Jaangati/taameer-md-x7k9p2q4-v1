name: Vault v5 editor and system dark polish
on:
  push:
    paths:
      - '.github/workflows/vault-v5-editor-system-dark.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Vault v5 patch
        run: |
          python .github/scripts/vault_v5_editor.py
          node --check js/vault.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/vault.js css/styles.css index.html
          git diff --cached --quiet || git commit -m 'Redesign Vault editor and unify system dark color'
          git push
