name: Wire Projects Library
on:
  push:
    paths:
      - '.github/workflows/wire-projects-library.yml'
      - '.github/scripts/wire_projects.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Projects module
        run: python .github/scripts/wire_projects.py
      - name: Validate Projects module
        run: |
          node --check js/projects.js
          grep -q 'js/projects.js' index.html
      - name: Commit wired module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/projects.js index.html
          git diff --cached --quiet || git commit -m "Wire Projects marketing library"
          git push
