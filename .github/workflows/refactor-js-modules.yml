name: Modularize dashboard JavaScript

on:
  push:
    branches: [refactor-v2]
    paths:
      - '.github/workflows/refactor-js-modules.yml'

permissions:
  contents: write

jobs:
  split-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-v2

      - name: Split app logic by responsibility
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          text = app_path.read_text(encoding='utf-8')

          markers = [
              '// ---------- Module registry ----------',
              '// ---------- Accent / theme ----------',
              '// ---------- Authentication ----------',
              '// ---------- Dashboard / navigation ----------',
              '// ---------- User administration ----------',
              '// ---------- Startup ----------',
          ]

          positions = []
          for marker in markers:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'Marker not found: {marker}')
              positions.append(pos)

          p_modules, p_theme, p_auth, p_ui, p_admin, p_start = positions

          files = {
              'js/core.js': text[:p_modules].strip() + '\n',
              'js/modules.js': text[p_modules:p_theme].strip() + '\n',
              'js/theme.js': text[p_theme:p_auth].strip() + '\n',
              'js/auth.js': text[p_auth:p_ui].strip() + '\n',
              'js/ui.js': text[p_ui:p_admin].strip() + '\n',
              'js/admin.js': text[p_admin:p_start].strip() + '\n',
              'js/app.js': text[p_start:].strip() + '\n',
          }

          for name, content in files.items():
              Path(name).write_text(content, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = '<script src="js/app.js"></script>'
          new = '\n'.join([
              '<script src="js/core.js"></script>',
              '<script src="js/modules.js"></script>',
              '<script src="js/theme.js"></script>',
              '<script src="js/auth.js"></script>',
              '<script src="js/ui.js"></script>',
              '<script src="js/admin.js"></script>',
              '<script src="js/app.js"></script>',
          ])
          if old not in html:
              raise SystemExit('app.js script tag not found in index.html')
          html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit modular structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/
          git diff --cached --quiet && exit 0
          git commit -m "Refactor: modularize dashboard JavaScript"
          git push origin refactor-v2
