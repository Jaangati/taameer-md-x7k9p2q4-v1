name: TAAMEER logo sizing patch

on:
  push:
    paths:
      - '.github/workflows/cleanup-modules-calendar.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update TAAMEER logos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_login = '<img src="assets/taameer-logo-white.svg" alt="TAAMEER" class="h-10 w-auto object-contain">'
          new_login = '<img src="assets/taameer-logo-white.svg" alt="TAAMEER" class="h-14 w-44 object-contain object-left">'
          assert old_login in s, 'Login logo not found'
          s = s.replace(old_login, new_login, 1)

          old_sidebar = '<div class="sidebar-label whitespace-nowrap"><div class="font-arabic text-lg font-bold leading-none text-white">تعمير</div><div class="text-[10px] font-semibold tracking-wider text-gray-400">TAAMEER</div></div>'
          new_sidebar = '<img src="assets/taameer-logo-white.svg" alt="TAAMEER" class="sidebar-label h-9 w-28 object-contain object-left flex-shrink-0">'
          assert old_sidebar in s, 'Sidebar text logo not found'
          s = s.replace(old_sidebar, new_sidebar, 1)

          p.write_text(s)
          PY

      - name: Validate and commit
        run: |
          grep -q 'h-14 w-44' index.html
          grep -q 'sidebar-label h-9 w-28' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use full TAAMEER logo in sidebar and enlarge login logo"
          git push
