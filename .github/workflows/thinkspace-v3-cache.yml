name: Thinkspace app registration fix
on:
  push:
    paths:
      - '.github/workflows/thinkspace-v3-cache.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Thinkspace registration and refresh asset
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/thinkspace.js')
          s=p.read_text()
          old='const ThinkspaceV3 = (() => {'
          new='const ThinkspaceApp = (() => {'
          assert old in s, 'Thinkspace app declaration not found'
          p.write_text(s.replace(old,new,1))

          p=Path('index.html')
          s=p.read_text()
          old='js/thinkspace.js?v=20260908-pro1'
          new='js/thinkspace.js?v=20260908-pro2'
          assert old in s, 'Thinkspace cache marker not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate JavaScript
        run: node --check js/thinkspace.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/thinkspace.js index.html
          git diff --cached --quiet || git commit -m 'Fix Thinkspace app registration'
          git push