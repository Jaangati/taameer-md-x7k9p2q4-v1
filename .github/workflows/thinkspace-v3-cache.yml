name: Thinkspace v3 cache refresh
on:
  push:
    paths:
      - '.github/workflows/thinkspace-v3-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Thinkspace asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='js/thinkspace.js?v=20260907-v2'
          new='js/thinkspace.js?v=20260908-pro1'
          assert old in s, 'Thinkspace script marker not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Load Thinkspace v3 without stale cache'
          git push