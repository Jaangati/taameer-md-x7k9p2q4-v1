name: Definitive Requests repair

# trigger v3
on:
  push:
    paths:
      - '.github/workflows/definitive-requests-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair Requests module and bust caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/requests.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const RequestsApp = (() => {','window.RequestsApp = (() => {',1)
          pattern=r"  async function open\(\)\{\s*ensureView\(\);"
          replacement="""  async function open(){
    const module = state.modules.find(m=>m.id==='requests') || {id:'requests',name:'Requests',desc:'Team requests, deadlines and accountability',icon:'fa-list-check',status:'active',roles:['admin','user']};
    ModuleRegistry.ensureView(module);
    root = document.getElementById('view-requests');
    if(!root) throw new Error('Requests view container missing');
    root.className='view-section h-full';
    ensureStyle();"""
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
              raise SystemExit(f'Requests open() replacement count={n}')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="js/requests\.js(?:\?[^\"]*)?"></script>','<script src="js/requests.js?v=20260912-v9"></script>',s,count=1)
          s=re.sub(r'<script src="js/app\.js(?:\?[^\"]*)?"></script>','<script src="js/app.js?v=20260912-v9"></script>',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and integration
        run: |
          node --check js/requests.js
          node --check js/app.js
          node --check js/ui.js
          grep -q "window.RequestsApp = " js/requests.js
          grep -q "Requests view container missing" js/requests.js
          grep -q "js/requests.js?v=20260912-v9" index.html
          grep -q "js/app.js?v=20260912-v9" index.html
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/requests.js index.html
          git diff --cached --quiet || git commit -m 'Definitively repair Requests rendering'
          git push
