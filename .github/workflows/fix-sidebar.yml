name: Apply home control panel redesign

on:
  push:
    paths:
      - '.github/workflows/fix-sidebar.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/home_control_panel.py
      - run: node --check js/theme.js
      - run: node --check js/ui.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/ui.js
          if ! git diff --cached --quiet; then
            git commit -m "Redesign home as TAAMEER control panel"
            git push
          fi
