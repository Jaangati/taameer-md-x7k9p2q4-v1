name: Fix sidebar layout

on:
  push:
    paths:
      - '.github/workflows/fix-sidebar.yml'
      - '.github/scripts/fix_sidebar.py'

jobs:
  fix-sidebar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply sidebar patch
        run: python .github/scripts/fix_sidebar.py
      - name: Commit sidebar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix sidebar alignment and toggle behavior"
          git push
