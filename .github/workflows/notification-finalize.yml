name: Finalize notification engine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notification-finalize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index cache versions and bell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="js/auth.js"></script>','<script src="js/auth.js?v=20260907-final"></script>')
          s=s.replace('<script src="js/notifications.js"></script>','<script src="js/notifications.js?v=20260907-final"></script>')
          s=s.replace('<script src="js/app.js"></script>','<script src="js/app.js?v=20260907-final"></script>')
          s=s.replace('<span class="absolute top-2 right-2 w-2 h-2 bg-accent rounded-full"></span>','')
          p.write_text(s)
          PY
      - name: Commit final notification wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize notification engine wiring and cache busting'
          git push
