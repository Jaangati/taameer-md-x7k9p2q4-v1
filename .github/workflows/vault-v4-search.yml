name: Polish Vault search v4
on:
  push:
    paths:
      - '.github/workflows/vault-v4-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vault search UX
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/vault.js')
          s = p.read_text()

          replacements = [
            (
              ".vault-askbox{position:relative;border-radius:24px;padding:18px;background:radial-gradient(circle at 85% 20%,rgba(124,92,255,.28),transparent 34%),linear-gradient(135deg,#111827 0%,#1e293b 55%,#4f46e5 150%);color:#fff;box-shadow:0 14px 34px rgba(15,23,42,.12);overflow:visible;z-index:30}",
              ".vault-askbox{position:relative;border-radius:24px;padding:18px;background:linear-gradient(135deg,#111827 0%,#1f2937 48%,var(--accent) 150%);color:#fff;box-shadow:0 16px 34px rgba(15,23,42,.16);overflow:hidden;z-index:3}"
            ),
            (
              ".vault-ask-input button{height:34px;padding:0 12px;border:0;border-radius:10px;background:linear-gradient(135deg,#6D5DFB,#4F46E5);color:white;font-size:11px;font-weight:800;white-space:nowrap}",
              ".vault-ask-input button{height:34px;padding:0 13px;border:0;border-radius:10px;background:var(--accent);color:white;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 6px 14px rgba(15,23,42,.12)}"
            ),
            (
              ".vault-count{font-size:10px;color:#9299a5}",
              ".vault-count{height:32px;padding:0 11px;border-radius:10px;background:#fff;border:1px solid #e2e6ec;box-shadow:0 7px 20px rgba(15,23,42,.08);font-size:10px;font-weight:800;color:#596273;display:flex;align-items:center;white-space:nowrap}"
            ),
            (
              '<div class="vault-ask-row"><div class="vault-ask-icon"><i class="fas fa-wand-magic-sparkles"></i></div><div class="vault-ask-copy"><strong>Ask Vault</strong><span>Search your department memory as you type.</span></div><div class="vault-ask-input"><i class="fas fa-magnifying-glass text-gray-400"></i><input id="vaultSearch" value="${esc(query)}" placeholder="Try “scale model dimensions”, “showrooms”, “team roles”..."><span class="vault-kbd">Ctrl K</span><button id="vaultAskGo">Ask</button></div></div>\n        <div id="vaultLive" class="vault-live"></div>',
              '<div class="vault-ask-row"><div class="vault-ask-icon"><i class="fas fa-magnifying-glass"></i></div><div class="vault-ask-copy"><strong>Search Vault</strong><span>Shortlist the actual notes instantly as you type.</span></div><div class="vault-ask-input"><i class="fas fa-magnifying-glass text-gray-400"></i><input id="vaultSearch" value="${esc(query)}" placeholder="Try “scale model dimensions”, “showrooms”, “team roles”..."><span class="vault-kbd">Ctrl K</span><button id="vaultAskGo">Search</button></div></div>'
            ),
            (
              "document.getElementById('vaultAskGo').onclick=()=>openAsk(document.getElementById('vaultSearch').value.trim());",
              "document.getElementById('vaultAskGo').onclick=()=>document.getElementById('vaultSearch').focus();"
            ),
            (
              "s.oninput=e=>{query=e.target.value;updateResults();updateLive();};\n    s.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openAsk(s.value.trim())}}\n    updateResults();updateLive();",
              "s.oninput=e=>{query=e.target.value;updateResults();};\n    s.onkeydown=e=>{if(e.key==='Escape'){query='';s.value='';updateResults();}};\n    updateResults();"
            ),
            (
              "const list=visibleItems(); count.textContent=`${list.length} note${list.length===1?'':'s'}${query?` matching “${query}”`:''}`;",
              "const list=visibleItems(); count.textContent=query?`${list.length} MATCHING NOTE${list.length===1?'':'S'}`:`${list.length} TOTAL NOTE${list.length===1?'':'S'}`;"
            )
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit('Expected Vault block not found: ' + old[:90])
            s = s.replace(old, new, 1)

          p.write_text(s)

          i = Path('index.html')
          h = i.read_text()
          old = 'js/vault.js?v=20260908-v3'
          if old not in h:
            raise SystemExit('Vault v3 asset reference not found')
          h = h.replace(old, 'js/vault.js?v=20260908-v4', 1)
          i.write_text(h)
          PY
          node --check js/vault.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/vault.js index.html
          git diff --cached --quiet || git commit -m 'Polish Vault search and theme accent'
          git push
