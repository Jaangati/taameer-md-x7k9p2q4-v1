name: Load dashboard v3 fixes
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Load dashboard v3 fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('<script src="js/requests-enhancements-v4.js?v=20260913-v1"></script>','<script src="js/requests-enhancements-v4.js?v=20260913-v1"></script>\n<script src="js/requests-fixes-v5.js?v=20260913-v1"></script>',1)
          s=s.replace('<script src="js/control-center-v2.js?v=20260913-v1"></script>','<script src="js/control-center-v2.js?v=20260913-v1"></script>\n<script src="js/control-center-v3.js?v=20260913-v1"></script>',1)
          p.write_text(s)
          PY
          node --check js/control-center-v3.js
          node --check js/requests-fixes-v5.js
          git config user.name 'TAAMEER Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Activate module user and request fixes'
          git push
