name: Projects Library cache refresh
on:
  push:
    branches: [projects-library-v2]
    paths: ['.github/workflows/projects-library-v2-cache.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Projects script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='js/projects.js?v=20260908-v2'
          new='js/projects.js?v=20260910-v3'
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('Projects script reference not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh Projects Library frontend cache"
          git push
