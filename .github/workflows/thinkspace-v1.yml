name: Thinkspace v1 build
on:
  push:
    paths:
      - '.github/workflows/thinkspace-v1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire Thinkspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/thinkspace.js')
          s=p.read_text()
          marker='// THINKSPACE VIEW ROUTER'
          if marker not in s:
              s += '''\n\n// THINKSPACE VIEW ROUTER\nconst _thinkspaceShowView = window.showView;\nwindow.showView = function(viewName){\n  _thinkspaceShowView(viewName);\n  if(viewName === 'thinkspace' && window.ThinkspaceApp) ThinkspaceApp.open();\n};\n'''
              p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          if 'html2canvas@1.4.1' not in s:
              s=s.replace('</head>','<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n</head>',1)
          if 'js/thinkspace.js' not in s:
              needle='<script src="js/app.js?v=20260907-final"></script>'
              if needle not in s:
                  needle='<script src="js/app.js"></script>'
              if needle not in s:
                  raise SystemExit('app.js script tag not found')
              s=s.replace(needle,'<script src="js/thinkspace.js?v=20260907-v1"></script>\n'+needle,1)
          p.write_text(s)

          final=p.read_text()
          assert 'js/thinkspace.js?v=20260907-v1' in final
          assert 'html2canvas@1.4.1' in final
          assert 'jspdf/2.5.1' in final
          print('Thinkspace assets wired')
          PY
          node --check js/thinkspace.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/thinkspace.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Launch Thinkspace v1"
          git push