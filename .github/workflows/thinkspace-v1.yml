name: Thinkspace v2 build
on:
  push:
    paths:
      - '.github/workflows/thinkspace-v1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Thinkspace v2
        shell: bash
        run: |
          B64=''
          printf '%s' "$B64" | base64 -d | gunzip > js/thinkspace.js
          sed -i 's/thinkspace.js?v=20260907-v1/thinkspace.js?v=20260907-v2/g' index.html
          node --check js/thinkspace.js
          grep -q 'thinkspace.js?v=20260907-v2' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/thinkspace.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Thinkspace v2 advanced workspace"
          git push
